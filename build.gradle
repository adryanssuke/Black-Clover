plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '1.0.19'
}

version = '0.1.0'
group = 'com.exemplo.blackclover'

base {
    archivesName = 'blackclover'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = '21.1.172'

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        blackclover {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
